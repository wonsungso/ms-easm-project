# API 구성 충족률 기준입니다. levels 문장과 rules 조건을 함께 변경하세요.
source: API 구성·기록 기반 평가 2026-11-09 - docs/api-notes.md
grading_profile: api_configuration_v1
interview_gap: 1.5
inactivity_days: 90
cost_window_days: 30
usage_window_days: 30
report_options:
  history_months: 6
  inactivity_days: 90
  audit_required_months: 12
  authenticated_modes: ["Microsoft Entra", "Generic OAuth 2.0"]
  orchestration_modes: ["Classic", "Generative"]
  targets:
    approval.match: 0.8
    registry.match: 0.9
    evaluation.predeploy: 0.8
    identity.conditional_access: 0.9
    security.exposure: 0.9
# 추가 보고서 지표입니다. 36·37은 각 플랫폼 구성 요소로 26개 항목에도 반영합니다.
report_items:
  DM-SY-27:
    title: 생성·승인 요청의 시간·ID 대사
    metric: approval.match
    limit: 별도 승인 워크플로의 전체 생성 코호트. 패키지 게시 승인·배포 --apply와 다름
  DP-SY-28:
    title: 독립 등록부와 관측 Agent ID 대사
    metric: registry.match
    limit: 승인된 조직 등록부와 명시적 ID 대조. 서비스 카탈로그 자체를 독립 등록부로 간주하지 않음
  BI-SY-29:
    title: 동일 버전의 배포 전 완료 평가 기록
    metric: evaluation.predeploy
    limit: 실제 완료 시각·배포 시각·버전 연결 필요. 프로젝트 평가 존재·생성 시각으로 대체하지 않음
  OE-SY-30:
    title: 조건부 접근의 명시적 Agent ID 대상 구성
    metric: identity.conditional_access
    limit: enabled 정책의 명시적 대상 구성만 확인. 미확인 All·속성 필터는 보류하며 실제 토큰 집행을 증명하지 않음
  OE-SY-31:
    title: 사용자 지정 감사 보존 정책 구성
    metric: audit.retention
    unit: months
    limit: 사용자 지정 정책의 최소 기간 구성. 기본·최종 유효 보존기간이나 실제 보존·수집을 뜻하지 않음
  OT-SY-32:
    title: Agent별 90일 전체 관측과 미사용 현황
    metric: usage.inactive90
    limit: 전체 관측 구간·호출 수가 확인된 Agent 단위 이력만 사용. 호스트·사용자 활동을 대신 사용하지 않음
  OT-SY-33:
    title: 고위험 민감 데이터 노출의 명시적 조치 상태
    metric: security.exposure
    limit: 승인된 실제 발견·조치 내보내기. 경보 닫힘·Defender 플랜 구성을 조치 완료로 추론하지 않음
  OT-SY-34:
    title: 월별 실제 비용·귀속 금액 기록
    metric: cost.history
    unit: series
    limit: 동일 통화·기간·범위의 청구 기록. 미관측 월·귀속 금액은 null. 환급·음수 순비용은 별도 검토
  DP-SY-35:
    title: Copilot 인벤토리 게시 시각 보유
    metric: copilot.published
    limit: API가 반환한 게시 시각 보유 비율. 배포 승인·현재 채널 응답·업무 품질을 뜻하지 않음
  DS-SY-36:
    title: Copilot 인벤토리 인증 방식 구성
    metric: copilot.authentication
    limit: 명시적 인증 방식 구성. OE-SY-19의 Copilot 부분 지표이며 실제 로그인·토큰 검증·권한 적정성은 별도 확인
  OE-SY-37:
    title: Copilot 인벤토리 소유자 존재
    metric: copilot.owner_presence
    limit: ownerId 존재 관측만 확인. BI-SY-13의 Copilot 부분 지표이며 재직·스폰서 지정·업무 책임 승인은 추론하지 않음
  DP-SY-38:
    title: 카탈로그 패키지의 게시 요청 승인 상태
    metric: catalog.publish_request_approval
    limit: 반환된 requestType=publish 요청의 상태. Agent 생성 업무 승인이나 전체 승인 이력이 아님
  OE-SY-39:
    title: 별도 인사 원천과 Agent 소유자 퇴사 대사
    metric: identity.departed
    limit: 승인된 인사 대사 원천 필요. 계정 비활성·로그인 없음으로 퇴사를 추론하지 않음
# 보고서 표시 분류입니다. 항목별 API 지표·분모·등급은 변경하지 않습니다.
report_groups:
  T1:
    label: 설정·정책
    codes: [DM-SY-01, DS-SY-02, DS-SY-04, DS-SY-05, DS-SY-06, DS-SY-07, BI-SY-08, BI-SY-11, BI-SY-12, BI-SY-14, OE-SY-19]
  T2:
    label: 자산 메타데이터
    codes: [BI-SY-13]
  T3:
    label: 신원·권한
    codes: [DS-SY-03, DP-SY-15, OE-SY-16, OE-SY-17]
  T4:
    label: 품질·보안
    codes: [BI-SY-09, BI-SY-10, OT-SY-25]
  T5:
    label: 관측·비용
    codes: [OE-SY-18, OE-SY-20, OE-SY-21, OE-SY-22, OT-SY-23, OT-SY-24, OT-SY-26]
workspace_retention_target_days: 90
version_upgrade_options:
- NoAutoUpgrade
- OnceNewDefaultVersionAvailable
- OnceCurrentVersionExpired
overprivileged_permission_patterns:
- '*.ReadWrite.All'
- '*.Write.All'
- '*FullControl*'
model_policy_definition_ids: []
items:
  DM-SY-01:
    title: Power Platform 환경의 역할 할당 현황
    scope: partial
    metric: environment_role_ratio
    numerator: 역할 할당이 1건 이상 확인된 환경 수
    denominator: 관리자에게 보이는 Power Platform 환경 수
    evidence: 환경 목록 API와 Get-AdminPowerAppEnvironmentRoleAssignment 또는 승인된 관리 센터 화면의 환경별 역할 할당 건수(별도 관리자 읽기 증적)
    limit: 역할 할당 건수가 고유 Maker 사용자 수나 권한의 적정성을 뜻하지 않으며 비 Dataverse 환경의 관리자 접근 범위로 한정됨
    product: Power Platform 관리 센터
    requires: tenant
    collectors: []
    complete_flags: []
    complete_subscriptions: []
    levels:
      L1: 역할 할당이 확인된 환경 비율 0%
      L2: 역할 할당이 확인된 환경 비율 0% 초과~80% 미만
      L3: 역할 할당이 확인된 환경 비율 80% 이상~90% 미만
      L4: 역할 할당이 확인된 환경 비율 90% 이상~100% 미만
      L5: 역할 할당이 확인된 환경 비율 100%
    rules: &coverage_rules
    - level: L5
      when:
        coverage:
          eq: 1
    - level: L4
      when:
        coverage:
          gte: 0.9
          lt: 1
    - level: L3
      when:
        coverage:
          gte: 0.8
          lt: 0.9
    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
  DS-SY-02:
    title: 데이터 정책(DLP) 적용 환경
    scope: partial
    metric: data_policy_environment_ratio
    numerator: 데이터 정책(DLP)이 적용된 환경 수
    denominator: 관리자에게 보이는 Power Platform 환경 수
    evidence: 환경 목록 API와 Get-AdminDlpPolicy·공식 BAP ListPoliciesV2 API 또는 승인된 관리 센터 화면의 정책 적용 범위(AllEnvironments·OnlyEnvironments·ExceptEnvironments)와 대상 환경 ID
    limit: 정책의 적용 범위만 확인하며 커넥터 분류·차단 내용이나 정책의 실효성은 확인하지 않음
    product: Power Platform 관리 센터
    requires: tenant
    collectors: []
    complete_flags: []
    complete_subscriptions: []
    levels:
      L1: 데이터 정책이 적용되는 환경 비율 0%
      L2: 데이터 정책이 적용되는 환경 비율 0% 초과~80% 미만
      L3: 데이터 정책이 적용되는 환경 비율 80% 이상~90% 미만
      L4: 데이터 정책이 적용되는 환경 비율 90% 이상~100% 미만
      L5: 데이터 정책이 적용되는 환경 비율 100%
    rules: *coverage_rules
  DS-SY-03:
    title: Agent ID의 Blueprint 연결
    scope: in_scope
    metric: blueprint_link_ratio
    numerator: Blueprint 연결이 확인된 Agent ID 수
    denominator: Graph Agent ID 수
    evidence: applications/microsoft.graph.agentIdentityBlueprint와 servicePrincipals/microsoft.graph.agentIdentity의
      agentIdentityBlueprintId 대조
    limit: Blueprint 조직 표준 승인이나 업무 유형 분류를 의미하지 않음
    collectors:
    - entra_agents
    - entra_blueprints
    complete_flags:
    - entra_agents_complete
    - entra_blueprints_complete
    complete_subscriptions: []
    levels:
      L1: Blueprint 연결 비율 0%
      L2: Blueprint 연결 비율 0% 초과~80% 미만
      L3: Blueprint 연결 비율 80% 이상~90% 미만
      L4: Blueprint 연결 비율 90% 이상~100% 미만
      L5: Blueprint 연결 비율 100%
    rules:
    - level: L5
      when:
        coverage:
          eq: 1
    - level: L4
      when:
        coverage:
          gte: 0.9
          lt: 1
    - level: L3
      when:
        coverage:
          gte: 0.8
          lt: 0.9
    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
    requires: entra
  DS-SY-04:
    title: 플랫폼별 모델·오케스트레이션 구성
    scope: partial
    metric: deployment_configuration_ratio
    numerator: 플랫폼별 모델 구성 정보가 확인된 대상 수
    denominator: Azure 모델 배포 및 Copilot Agent 수
    evidence: Azure 모델 배포의 이름·버전·형식·업데이트 옵션과 Copilot 인벤토리 model·orchestration
    limit: Copilot은 모델 선택 레이블·오케스트레이션만 확인. 실제 기반 모델 버전·허용 모델 승인·퇴역 대응을 뜻하지 않음
    copilot_inventory_check: model
    collectors:
    - model_deployments
    - copilot_inventory
    complete_flags:
    - deployment_inventory_complete
    - copilot_inventory_complete
    complete_subscriptions: []
    levels:
      L1: 플랫폼별 모델 구성 확인 비율 0%
      L2: 플랫폼별 모델 구성 확인 비율 0% 초과~80% 미만
      L3: 플랫폼별 모델 구성 확인 비율 80% 이상~90% 미만
      L4: 플랫폼별 모델 구성 확인 비율 90% 이상~100% 미만
      L5: 플랫폼별 모델 구성 확인 비율 100%
    rules:
    - level: L5
      when:
        coverage:
          eq: 1
    - level: L4
      when:
        coverage:
          gte: 0.9
          lt: 1
    - level: L3
      when:
        coverage:
          gte: 0.8
          lt: 0.9
    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
  DS-SY-05:
    title: 플랫폼별 접근 범위 구성
    scope: partial
    metric: network_boundary_ratio
    numerator: 플랫폼별 접근 범위 조건을 충족한 대상 수
    denominator: AI 계정·자체 Agent 호스트 및 Copilot Agent 수
    evidence: Azure 비공개 인바운드·접근 제한과 Copilot authentication·sharedWithViewers.entireTenant
    limit: Copilot은 인증 사용·전체 테넌트 공유 제한만 확인하며 네트워크 격리·공개 채널 차단·공유 승인을 뜻하지 않음
    copilot_inventory_check: access
    collectors:
    - proposal_DS-SY-05
    - copilot_inventory
    complete_flags: [copilot_inventory_complete]
    complete_subscriptions:
    - proposal_network_complete
    levels:
      L1: 플랫폼별 접근 범위 구성 비율 0%
      L2: 플랫폼별 접근 범위 구성 비율 0% 초과~80% 미만
      L3: 플랫폼별 접근 범위 구성 비율 80% 이상~90% 미만
      L4: 플랫폼별 접근 범위 구성 비율 90% 이상~100% 미만
      L5: 플랫폼별 접근 범위 구성 비율 100%
    rules:
    - level: L5
      when:
        coverage:
          eq: 1
    - level: L4
      when:
        coverage:
          gte: 0.9
          lt: 1
    - level: L3
      when:
        coverage:
          gte: 0.8
          lt: 0.9
    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
  DS-SY-06:
    title: 도구 승인·사용자 동의 구성
    scope: partial
    metric: mcp_approval_ratio
    numerator: 플랫폼별 승인·동의 조건을 충족한 도구 수
    denominator: MCP 도구 및 활성 Copilot 커넥터 작업 수
    evidence: Azure MCP require_approval=always 및 Copilot 커넥터 requiresEndUserConsent
    limit: 사용자 동의는 실행별 사람 승인과 다름. 비활성·함수·내장 도구 제외. 200개 제한·건수 불일치는 보류
    copilot_inventory_check: connector_consent
    collectors:
    - foundry_agents
    - foundry_projects
    - copilot_inventory
    complete_flags: [copilot_inventory_complete]
    complete_subscriptions: []
    levels:
      L1: 플랫폼별 도구 승인·동의 구성 비율 0%
      L2: 플랫폼별 도구 승인·동의 구성 비율 0% 초과~80% 미만
      L3: 플랫폼별 도구 승인·동의 구성 비율 80% 이상~90% 미만
      L4: 플랫폼별 도구 승인·동의 구성 비율 90% 이상~100% 미만
      L5: 플랫폼별 도구 승인·동의 구성 비율 100%
    rules:
    - level: L5
      when:
        coverage:
          eq: 1
    - level: L4
      when:
        coverage:
          gte: 0.9
          lt: 1
    - level: L3
      when:
        coverage:
          gte: 0.8
          lt: 0.9
    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
    agent_denominator: true
  DS-SY-07:
    title: 외부 도구 HTTPS 연결 구성
    scope: partial
    metric: https_endpoint_ratio
    numerator: 유효한 HTTPS로 확인된 외부 도구 URL 수
    denominator: 명시적 외부 도구 URL 수
