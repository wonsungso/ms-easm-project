# API 구성 충족률 기준입니다. levels 문장과 rules 조건을 함께 변경하세요.
source: API 구성·기록 기반 평가 2026-11-09 - docs/api-notes.md
grading_profile: api_configuration_v1
interview_gap: 1.5
inactivity_days: 90
cost_window_days: 30
new_agent_window_days: 183
usage_window_days: 30
workspace_retention_target_days: 90
version_upgrade_options:
- NoAutoUpgrade
- OnceNewDefaultVersionAvailable
- OnceCurrentVersionExpired
overprivileged_permission_patterns:
- '*.ReadWrite.All'
- '*.Write.All'
- '*FullControl*'
model_policy_definition_ids: []
items:
  DM-SY-01:
    title: Agent 제작 허용 유형의 거버넌스 분류
    scope: partial
    metric: governed_agent_type_ratio
    denominator: Agent 365 등록 패키지 수
    evidence: copilotPackages의 governanceMetadata(PromptAgent·HostedAgent·WorkflowAgent·ManagedAgent·Unmanaged·AIApp)
    limit: 등록부의 분류값이며 제작 허용 사용자 범위 설정 자체나 실제 제작 통제 효과를 뜻하지 않음. Agent 365 라이선스와 CopilotPackages.Read.All이 필요
    product: Microsoft 365 관리 센터(Agent 365)
    requires: tenant
    collectors:
    - agent365_registry
    complete_flags:
    - agent365_registry_complete
    complete_subscriptions: []
    levels:
      L1: 거버넌스 분류가 Unmanaged가 아닌 패키지 비율 0%
      L2: 거버넌스 분류가 Unmanaged가 아닌 패키지 비율 0% 초과~80% 미만
      L3: 거버넌스 분류가 Unmanaged가 아닌 패키지 비율 80% 이상~90% 미만
      L4: 거버넌스 분류가 Unmanaged가 아닌 패키지 비율 90% 이상~100% 미만
      L5: 거버넌스 분류가 Unmanaged가 아닌 패키지 비율 100%
    rules: &coverage_rules
    - level: L5
      when:
        coverage:
          eq: 1
    - level: L4
      when:
        coverage:
          gte: 0.9
          lt: 1
    - level: L3
      when:
        coverage:
          gte: 0.8
          lt: 0.9
    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
