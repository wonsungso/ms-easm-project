      L2: 모델·버전·형식·업데이트 옵션 구성 비율 0% 초과~80% 미만
      L3: 모델·버전·형식·업데이트 옵션 구성 비율 80% 이상~90% 미만
      L4: 모델·버전·형식·업데이트 옵션 구성 비율 90% 이상~100% 미만
      L5: 모델·버전·형식·업데이트 옵션 구성 비율 100%
    rules:
    - level: L5
      when:
        coverage:
          eq: 1
    - level: L4
      when:
        coverage:
          gte: 0.9
          lt: 1
    - level: L3
      when:
        coverage:
          gte: 0.8
          lt: 0.9
    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
