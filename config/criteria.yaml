    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
    agent_denominator: true
  BI-SY-08:
    title: 관리형 환경 적용
    scope: partial
    metric: managed_environment_ratio
    numerator: 관리형(Managed)으로 확인된 환경 수
    denominator: 관리자에게 보이는 Power Platform 환경 수
    evidence: 환경 목록 API의 protectionLevel(Standard는 관리형 환경으로 해석, Basic은 비관리형으로 관측)
    limit: 환경 유형·보호 수준의 원본 값만 확인하며 개발·테스트·운영 분리나 배포 경로 통제는 확인하지 않음
    product: Power Platform 관리 센터
    requires: tenant
    collectors: []
    complete_flags: []
    complete_subscriptions: []
    levels:
      L1: 관리형 환경 비율 0%
      L2: 관리형 환경 비율 0% 초과~80% 미만
      L3: 관리형 환경 비율 80% 이상~90% 미만
      L4: 관리형 환경 비율 90% 이상~100% 미만
      L5: 관리형 환경 비율 100%
    rules: *coverage_rules
