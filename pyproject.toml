[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easm-agent"
version = "0.1.0"
description = "Read-only Azure/Foundry governance system evidence"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.19,<2",
  "requests>=2.32.4,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "azure-ai-projects>=2.3,<3",
  "openai>=2,<3",
  "cryptography>=44",
  "lxml>=4.9,<7",
  "openpyxl>=3.1.5,<4",
  "python-pptx>=1.0,<2",
]

[project.scripts]
easm-agent = "easm_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]
connected-demo = ["boto3[crt]>=1.42,<2", "snowflake-connector-python>=3.18,<5"]
demo = [
  "azure-identity>=1.19,<2",
  "azure-ai-projects>=2.3,<3",
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/easm-agent" = ["config/criteria.yaml", "config/report-layout.json", "docs/assessment-result-template.xlsx", "docs/assessment-report-template.pptx"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
